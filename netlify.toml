[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Retired public offers redirect to current services; historical files stay intact.
[[redirects]]
  from = "/hire-technicians-labour/civil-labour/"
  to = "/hire-technicians-labour/"
  status = 301
  force = true

[[redirects]]
  from = "/downloads/HM-ELECTRICAL-Company-Profile-2026-Public.pdf"
  to = "/downloads/HM-ELECTRICAL-Company-Overview-2026.pdf"
  status = 301
  force = true

# Existing static pages retain priority; newly added Admin materials use live HTML.
[[redirects]]
  from = "/products/*"
  to = "/.netlify/functions/public-product-page?slug=:splat"
  status = 200
  force = false

[[redirects]]
  from = "/live-products-sitemap.xml"
  to = "/.netlify/functions/live-products-sitemap"
  status = 200

[functions]
  node_bundler = "esbuild"
  # PDFKit resolves its standard fonts inside its own package at runtime.
  # Keep it intact: inlining it produces a live-only '#standard-fonts' error.
  external_node_modules = ["sharp", "pdfkit"]
  included_files = ["public/company.json", "server/catalogue.json"]

[functions."notify"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/downloads/HM-ELECTRICAL-Company-Profile-2026-Public.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"HM-ELECTRICAL-Company-Profile-2026.pdf\""
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

[[redirects]]
  from = "/photos/projects/site-23.jpeg"
  to = "/unavailable-photo.html"
  status = 404
  force = true

[[redirects]]
  from = "/photos/projects/site-27.jpeg"
  to = "/unavailable-photo.html"
  status = 404
  force = true
